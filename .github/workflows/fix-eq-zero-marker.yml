name: Align EQ zero dB marker

on:
  push:
    paths:
      - '.github/workflows/fix-eq-zero-marker.yml'
      - 'app/src/main/java/com/example/ui/components/Equalizer31Band.kt'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align scale
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/components/Equalizer31Band.kt')
          s = p.read_text()
          old = '''                    Column(Modifier.width(24.dp).height(158.dp), verticalArrangement = Arrangement.SpaceBetween) {
                        Text("+12", color = TextSecondary, fontSize = 8.sp)
                        Text("0", color = TextSecondary, fontSize = 8.sp)
                        Text("-12", color = TextSecondary, fontSize = 8.sp)
                    }'''
          new = '''                    Box(Modifier.width(24.dp).height(150.dp)) {
                        Text("+12", color = TextSecondary, fontSize = 8.sp, modifier = Modifier.align(Alignment.TopCenter))
                        Text("0", color = AudioCyan, fontSize = 9.sp, fontWeight = FontWeight.Bold, modifier = Modifier.align(Alignment.Center))
                        Text("-12", color = TextSecondary, fontSize = 8.sp, modifier = Modifier.align(Alignment.BottomCenter))
                    }'''
          if old not in s:
              raise SystemExit('EQ scale block not found')
          s = s.replace(old, new)
          s = s.replace('''                val center = size.height / 2f
                drawLine(RackBorder.copy(alpha=.9f), Offset(x, top), Offset(x, bottom), strokeWidth=4f)''', '''                val center = size.height / 2f
                // Exact 0 dB reference line: same vertical center as the 0 dB label.
                drawLine(RackBorder.copy(alpha=.9f), Offset(x, top), Offset(x, bottom), strokeWidth=4f)''')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/components/Equalizer31Band.kt
          git rm .github/workflows/fix-eq-zero-marker.yml
          git commit -m 'fix: align EQ 0 dB marker with fader center [skip ci]'
          git push
