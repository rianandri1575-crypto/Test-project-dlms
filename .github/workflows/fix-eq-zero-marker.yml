name: Align EQ zero dB marker

on:
  push:
    paths:
      - '.github/workflows/fix-eq-zero-marker.yml'
      - 'app/src/main/java/com/example/ui/components/Equalizer31Band.kt'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align scale to fader travel
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/components/Equalizer31Band.kt')
          s = p.read_text()
          old = '''                    Box(Modifier.width(24.dp).height(EQ_TRACK_HEIGHT_DP.dp)) {
                        Text("+12", color = TextSecondary, fontSize = 8.sp, modifier = Modifier.align(Alignment.TopCenter).offset(y = (EQ_TRACK_TOP_PX / 1.0f).dp - 6.dp))
                        Text("0", color = AudioCyan, fontSize = 9.sp, fontWeight = FontWeight.Bold, modifier = Modifier.align(Alignment.Center))
                        Text("-12", color = TextSecondary, fontSize = 8.sp, modifier = Modifier.align(Alignment.BottomCenter).offset(y = -(EQ_TRACK_HEIGHT_DP - EQ_TRACK_BOTTOM_PX).dp + 6.dp))
                    }'''
          new = '''                    Box(Modifier.width(24.dp).height(EQ_TRACK_HEIGHT_DP.dp)) {
                        // Labels are aligned to the exact fader track coordinates: 15 / 75 / 135 px.
                        Text("+12", color = TextSecondary, fontSize = 8.sp, modifier = Modifier.align(Alignment.TopCenter).offset(y = 9.dp))
                        Text("0", color = AudioCyan, fontSize = 9.sp, fontWeight = FontWeight.Bold, modifier = Modifier.align(Alignment.Center))
                        Text("-12", color = TextSecondary, fontSize = 8.sp, modifier = Modifier.align(Alignment.BottomCenter).offset(y = (-15).dp))
                    }'''
          if old not in s:
              raise SystemExit('Current EQ scale block not found')
          p.write_text(s.replace(old, new))
      - name: Commit and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/components/Equalizer31Band.kt
          git rm .github/workflows/fix-eq-zero-marker.yml
          git commit -m 'fix: align EQ labels with exact fader positions [skip ci]'
          git push
